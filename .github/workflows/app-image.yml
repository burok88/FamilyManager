# Baut das Container-Image der Home-Assistant-App und legt es in die GitHub Container
# Registry. Home Assistant laedt es von dort (config.yaml -> image), statt selbst zu bauen.
# Das Tag ist die Version aus config.yaml: nur eine neue Version zeigt Home Assistant als
# Update an.
name: App-Image bauen

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "ha-app/**"
      - "mcp-server/mcp_server.py"
      - "requirements.txt"
      - ".github/workflows/app-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Image-Name
        id: meta
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' ha-app/config.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ontofam-amd64" >> "$GITHUB_OUTPUT"

      - name: Image bauen
        run: >
          docker build
          --build-arg BUILD_VERSION=${{ steps.meta.outputs.version }}
          -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          -f ha-app/Dockerfile .

      # Vor dem Veroeffentlichen: app.py im Container laden -- das oeffnet eine leere
      # Datenbank und legt das Schema an. Faengt fehlende Pakete und CPU-Probleme ab.
      - name: Image pruefen
        run: >
          docker run --rm -e ONTOFAM_DB=/tmp/test_db ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          python -c "import sys; sys.path.insert(0, '/app'); import waitress, app, mcp_server;
          print('ok:', sorted(app.VERTRAUTE_ADRESSEN), app.DB_PATH)"

      # Der MCP-Server fuer Assist muss per SSE antworten -- so, wie Home Assistant ihn anspricht.
      - name: MCP-Server (SSE) pruefen
        run: |
          docker run -d --name mcp -p 8765:8765 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} \
            python /app/mcp_server.py --sse --host 0.0.0.0 --port 8765
          for i in $(seq 1 20); do
            antwort=$(curl -s -m 2 http://localhost:8765/sse || true)
            echo "$antwort" | grep -q "event: endpoint" && { echo "SSE ok"; docker rm -f mcp; exit 0; }
            sleep 1
          done
          docker logs mcp; exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image veroeffentlichen
        run: docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
