name: ontoFam
version: "0.10.0"
slug: ontofam
url: https://github.com/burok88/FamilyManager
# Fertiges Image aus der GitHub Container Registry (gebaut von
# .github/workflows/app-image.yml, Tag = version). Home Assistant baut nicht selbst.
image: ghcr.io/burok88/ontofam-{arch}
description: Haushalts-Ontologie der Familie – Aufgaben, Termine, Stundenpläne, Erinnerungen
arch:
  - amd64
init: false
startup: application
boot: auto

# Oberfläche in der Seitenleiste; Home Assistant meldet die Nutzer an.
ingress: true
ingress_port: 5000
panel_icon: mdi:home-heart
panel_title: ontoFam

# Erinnerungen über die Companion-App, mit dem Token, das Home Assistant jedem
# Add-on gibt -- kein langlebiges Token nötig.
homeassistant_api: true

# Datenbank in /config: auf der Samba-Freigabe unter addon_configs sichtbar
# (für den Umzug) und Teil des Add-on-Backups. "cold": das Add-on wird fürs
# Backup kurz gestoppt, damit die Datenbank in sich stimmig gesichert wird.
map:
  - addon_config:rw
backup: cold

# Für Claude Desktop im Heimnetz. Ohne Zugriffsschlüssel weist ontoFam hier alles ab.
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: Schnittstelle für Claude Desktop (nur mit Zugriffsschlüssel)

options:
  kalender: []
  zugriffsschluessel: ""
  empfaenger: []
  abend: "19:00"
  morgen: "07:00"
  stunden_vorher: 2
  speicher_mb: 512
  assist: true
schema:
  kalender:
    - name: str
      url: password
  zugriffsschluessel: password?
  empfaenger:
    - person: str
      dienst: str
  abend: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  morgen: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  stunden_vorher: int(0,24)
  speicher_mb: int(128,4096)
  assist: bool
